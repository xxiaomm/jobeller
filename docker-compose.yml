services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: jobell
      POSTGRES_USER: jobell
      POSTGRES_PASSWORD: jobell
    ports:
      # host 5433 -> container 5432, to avoid clashing with the jobell project's postgres on 5432
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      # host 6380 -> container 6379, to avoid clashing with the jobell project's redis on 6379
      - "6380:6379"

volumes:
  pgdata:
