[project]
name = "backend"
version = "0.1.0"
description = "Jobell API service"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.13",
    "pydantic-settings>=2.6",
    "bcrypt>=4.1",
    "pyjwt>=2.9",
    "httpx>=0.27",
    "email-validator>=2.0",
    "python-multipart>=0.0.12",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
